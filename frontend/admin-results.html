<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results — Online Quiz Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">Online Quiz</a>
        <nav></nav>
        <div class="who"><span data-user-name></span><button type="button" class="link" data-logout>Log out</button></div>
    </header>

    <main class="container">
        <div class="page-head"><h1>Quiz results</h1><span class="muted" id="count"></span></div>
        <p id="message" class="message" role="alert" hidden></p>
        <section class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Date</th><th>Player</th><th>Category</th><th class="num">Score</th><th class="num">%</th></tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script type="module" src="js/admin-results.js"></script>
</body>
</html>
