<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz — Log in</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <h1 class="brand">Online Quiz</h1>
        <p class="muted">Take quizzes, see your scores, climb the leaderboard. Admins log in here too.</p>

        <div class="tabs" role="tablist">
            <button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="login-form">Log in</button>
            <button type="button" role="tab" id="tab-register" aria-selected="false" aria-controls="register-form">Register</button>
        </div>

        <p id="message" class="message" role="alert" hidden></p>

        <form id="login-form" role="tabpanel" aria-labelledby="tab-login" class="stack">
            <label>Email <input type="email" name="email" autocomplete="email" required></label>
            <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
            <button type="submit" class="btn primary">Log in</button>
        </form>

        <form id="register-form" role="tabpanel" aria-labelledby="tab-register" class="stack" hidden>
            <label>Name <input type="text" name="name" autocomplete="name" maxlength="60" required></label>
            <label>Email <input type="email" name="email" autocomplete="email" required></label>
            <label>Password <input type="password" name="password" autocomplete="new-password" minlength="6" required></label>
            <button type="submit" class="btn primary">Create account</button>
        </form>
    </main>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
